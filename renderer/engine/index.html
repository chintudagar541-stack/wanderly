<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>THE PERFECT ALIBI - engine</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0e14; }
  #shots, .shot, .world, canvas, .overlay { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .shot { overflow: hidden; }
  .layer, .charhost { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .charhost { width: 1920px; height: 1080px; }
  .layer > svg, .layer > img { display: block; width: 100%; height: 100%; }
  .character { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .character > svg { display: block; width: 100%; height: 100%; overflow: visible; }
  #rain { mix-blend-mode: screen; }
  #lines { mix-blend-mode: screen; }
  #grain { mix-blend-mode: overlay; }
  #light { pointer-events: none; }
  #vignette { background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 48%, rgba(0,0,0,.85) 100%); }
  #flash { background: #fff; opacity: 0; }
  #black { background: #000; opacity: 0; }
  #subtitle {
    position: absolute; left: 160px; right: 160px; bottom: 64px; text-align: center;
    font: 600 44px/1.25 "Inter", "DejaVu Sans", sans-serif; color: #f2f2f2; letter-spacing: .3px;
    text-shadow: 0 0 6px #000, 0 2px 3px #000, 0 0 2px #000;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="shots"></div>
  <div id="light" class="overlay"></div>
  <canvas id="rain" width="1920" height="1080"></canvas>
  <canvas id="lines" width="1920" height="1080"></canvas>
  <div id="vignette" class="overlay"></div>
  <canvas id="grain" width="1920" height="1080"></canvas>
  <div id="flash" class="overlay"></div>
  <div id="black" class="overlay"></div>
  <div id="subtitle" style="display:none"></div>
</div>
<script type="module" src="./engine.js"></script>
</body>
</html>
