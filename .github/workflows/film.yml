# Renders a film with Blender Cycles on GitHub's free runners (public repo).
# blender/film.json: mode "stills" = one checking frame per shot (pushed to previews/film/); mode "video" = every frame,
# split over many machines, joined with the voiceover into an MP4 (artifact "video").
# Assets from Poly Haven (CC0): https://polyhaven.com
name: Film render
on:
  push:
    branches: [claude/blender-previews]
    paths: ['blender/film.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: film-render, cancel-in-progress: true }
env:
  BLENDER: blender-4.2.3-linux-x64
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { jobs: '${{ steps.p.outputs.jobs }}', film: '${{ steps.p.outputs.film }}', mode: '${{ steps.p.outputs.mode }}', samples: '${{ steps.p.outputs.samples }}' }
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: |
          F=$(jq -r .film blender/film.json); M=$(jq -r .mode blender/film.json); C=$(jq -r .chunk blender/film.json); O=$(jq -r .only blender/film.json)
          echo "film=$F" >> $GITHUB_OUTPUT; echo "mode=$M" >> $GITHUB_OUTPUT; echo "samples=$(jq -r .samples blender/film.json)" >> $GITHUB_OUTPUT
          echo "jobs=$(python3 blender/plan_film.py $F $M $C "$O")" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: { job: '${{ fromJson(needs.plan.outputs.jobs) }}' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: bcache
        with: { path: '${{ env.BLENDER }}', key: '${{ env.BLENDER }}' }
      - if: steps.bcache.outputs.cache-hit != 'true'
        run: curl -sSL https://download.blender.org/release/Blender4.2/$BLENDER.tar.xz | tar xJ
      - uses: actions/cache@v4
        with: { path: /tmp/ph, key: 'phf-${{ matrix.job.shot }}-${{ github.run_id }}', restore-keys: 'phf-${{ matrix.job.shot }}-' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 ffmpeg >/dev/null
      - name: Render
        env: { SAMPLES: '${{ needs.plan.outputs.samples }}' }
        run: |
          mkdir -p out; set -o pipefail
          if [ "${{ needs.plan.outputs.mode }}" = "stills" ]; then
            ./$BLENDER/blender -b --factory-startup -noaudio --python-exit-code 1 -P blender/render_film.py -- ${{ needs.plan.outputs.film }} still ${{ matrix.job.shot }} out/${{ matrix.job.shot }}.png 2>&1 | grep -v "^Fra:" | tee out/log.txt | tail -300
          else
            ./$BLENDER/blender -b --factory-startup -noaudio --python-exit-code 1 -P blender/render_film.py -- ${{ needs.plan.outputs.film }} frames ${{ matrix.job.shot }} ${{ matrix.job.a }} ${{ matrix.job.b }} out/frames 2>&1 | grep -v "^Fra:" | tee out/log.txt | tail -300
            S=$(ls out/frames | head -1 | sed 's/f_0*//; s/.png//')
            ffmpeg -loglevel error -y -framerate 24 -start_number $S -i out/frames/f_%05d.png -c:v libx264 -preset slow -crf 14 -pix_fmt yuv420p out/chunk_${{ matrix.job.id }}.mp4
            rm -rf out/frames
          fi
      - name: Save still and log to the branch
        if: always() && needs.plan.outputs.mode == 'stills'
        run: |
          mkdir -p previews/film logs/film
          [ -f out/${{ matrix.job.shot }}.jpg ] && cp out/${{ matrix.job.shot }}.jpg previews/film/ || true
          tail -c 40000 out/log.txt > logs/film/${{ matrix.job.shot }}.log 2>/dev/null || echo "no log" > logs/film/${{ matrix.job.shot }}.log
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add previews/film logs/film; git commit -qm "film still ${{ matrix.job.shot }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 9 + 3)); done
      - name: Save log of a failed chunk to the branch
        if: failure() && needs.plan.outputs.mode == 'video'
        run: |
          mkdir -p logs/film; tail -c 30000 out/log.txt > logs/film/fail_${{ matrix.job.id }}_${{ matrix.job.shot }}.log 2>/dev/null || echo "no log" > logs/film/fail_${{ matrix.job.id }}.log
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add logs/film; git commit -qm "film fail log [skip ci]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 9 + 3)); done
      - if: always() && needs.plan.outputs.mode == 'video'
        uses: actions/upload-artifact@v4
        with: { name: 'chunk-${{ matrix.job.id }}', path: 'out/', retention-days: 7 }
  join:
    needs: [plan, render]
    if: needs.plan.outputs.mode == 'video'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: 'chunk-*', merge-multiple: true }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ls art | grep -c mp4
          for f in $(ls art/chunk_*.mp4 | sort); do echo "file '$PWD/$f'" >> list.txt; done
          ffmpeg -loglevel error -y -f concat -safe 0 -i list.txt -c copy video.mp4
          V=$(jq -r .voice blender/films_${{ needs.plan.outputs.film }}.json); END=$(jq -r .end blender/films_${{ needs.plan.outputs.film }}.json)
          ffmpeg -loglevel error -y -i video.mp4 -i $V -filter_complex "[0:v]fade=t=out:st=$(echo "$END - 1.0" | bc):d=1.0[v];[1:a]loudnorm=I=-14:TP=-1.5,apad[a]" -map "[v]" -map "[a]" -t $END -c:v libx264 -preset slow -crf 15 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart ${{ needs.plan.outputs.film }}_2k.mp4
          ffmpeg -loglevel error -y -i ${{ needs.plan.outputs.film }}_2k.mp4 -c:v libx264 -preset slow -crf 23 -c:a copy -movflags +faststart ${{ needs.plan.outputs.film }}_2k_small.mp4
          ls -la *.mp4
      - uses: actions/upload-artifact@v4
        with: { name: 'video', path: '*_2k*.mp4', retention-days: 30 }
