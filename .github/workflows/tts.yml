# Offline TTS (Kokoro-82M + Piper) on a CPU runner.  Push audio/voices/voices.json (or run manually) to
# audition every candidate voice; small MP3 previews are committed to audio/voices/samples/.
name: TTS voices
on:
  push:
    branches: [claude/perfect-alibi]
    paths: ['audio/voices/voices.json', 'scripts/tts.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with: { path: "~/.cache/huggingface\n~/.cache/piper-voices", key: tts-models-v1, restore-keys: tts-models- }
      - name: install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile piper-tts misaki[en] 2>&1 | tail -3
      - name: audition voices
        run: python3 scripts/tts.py audition || echo "some voices failed (see report)"
      - name: mp3 previews
        if: always()
        run: |
          cd audio/voices/samples 2>/dev/null || exit 0
          for f in *.wav; do ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -b:a 96k "${f%.wav}.mp3"; done
          rm -f *.wav; ls -la
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: voice-samples, path: audio/voices/samples }
      - name: commit previews
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add audio/voices/samples audio/voices/tts_report.txt 2>/dev/null; git commit -qm "voice auditions [skip ci]" || exit 0
          for i in $(seq 1 10); do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
