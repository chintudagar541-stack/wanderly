# Renders still previews with Blender (Cycles, CPU) on GitHub's free runners (public repo).
# Edit blender/jobs.json to choose scenes and draft/full quality, then push. Results land in previews/ on this branch.
# Assets from Poly Haven (CC0): https://polyhaven.com
name: Blender previews
on:
  push:
    branches: [claude/blender-previews]
    paths: ['blender/**', 'tools/**', '.github/workflows/blender-previews.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: blender-previews, cancel-in-progress: true }
env:
  BLENDER: blender-4.2.3-linux-x64
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { scenes: '${{ steps.p.outputs.scenes }}', draft: '${{ steps.p.outputs.draft }}' }
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          echo "scenes=$(jq -c .scenes blender/jobs.json)" >> $GITHUB_OUTPUT
          echo "draft=$(jq -r 'if .draft then 1 else 0 end' blender/jobs.json)" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: { scene: '${{ fromJson(needs.plan.outputs.scenes) }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: bcache
        with: { path: '${{ env.BLENDER }}', key: '${{ env.BLENDER }}' }
      - if: steps.bcache.outputs.cache-hit != 'true'
        run: curl -sSL https://download.blender.org/release/Blender4.2/$BLENDER.tar.xz | tar xJ
      - uses: actions/cache@v4
        with: { path: /tmp/ph, key: 'ph-${{ matrix.scene }}-${{ github.run_id }}', restore-keys: 'ph-${{ matrix.scene }}-' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 >/dev/null
      - name: Render
        env: { DRAFT: '${{ needs.plan.outputs.draft }}' }
        run: |
          mkdir -p out
          set -o pipefail
          ./$BLENDER/blender -b --factory-startup -noaudio --python-exit-code 1 -P blender/run.py -- ${{ matrix.scene }} out/${{ matrix.scene }}.png 2>&1 | grep -v "^Fra:" | tee out/${{ matrix.scene }}.log | tail -400
      - if: always()
        run: |
          [ -f out/${{ matrix.scene }}.png ] && ffmpeg -loglevel error -y -i out/${{ matrix.scene }}.png -q:v 3 out/${{ matrix.scene }}.jpg || true
          tail -c 60000 out/${{ matrix.scene }}.log > out/${{ matrix.scene }}.tail.log 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'scene-${{ matrix.scene }}', path: out/, retention-days: 14 }
  save:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - run: |
          mkdir -p previews logs
          find art -name '*.jpg' -exec cp {} previews/ \;
          find art -name '*.json' -exec cp {} previews/ \;
          find art -name '*.tail.log' -exec cp {} logs/ \;
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add previews logs
          git commit -m "Blender previews [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
