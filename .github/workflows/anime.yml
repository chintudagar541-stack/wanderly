# Anime illustration with Animagine XL 4.0 (SDXL, open weights) on CPU runners. Edit anime/job.json and push.
name: Anime gen
on:
  push:
    branches: [claude/dagar-blender]
    paths: ['anime/job.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { idx: '${{ steps.p.outputs.idx }}' }
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: echo "idx=$(jq -c '[range(0; .items|length)]' anime/job.json)" >> $GITHUB_OUTPUT
  gen:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy: { fail-fast: false, matrix: { i: '${{ fromJson(needs.plan.outputs.idx) }}' } }
    steps:
      - uses: actions/checkout@v5
      - name: swap + space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 10G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2 || true
          free -g; df -h / | tail -1
      - uses: actions/cache@v4
        with: { path: '~/.cache/huggingface', key: 'hf-animagine4', restore-keys: 'hf-' }
      - name: deps
        run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q diffusers transformers accelerate safetensors pillow
      - name: generate
        run: |
          ( while true; do sleep 30; echo "MEM $(free -m | awk '/Mem/{print $3}')MB"; done ) &
          python3 anime/gen.py anime/job.json ${{ matrix.i }} out 2>&1 | grep -v "it/s\]" | tail -80
      - name: save
        if: always()
        run: |
          mkdir -p previews/anime; cp out/*.png previews/anime/ 2>/dev/null || exit 0
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add previews/anime; git commit -qm "anime gen ${{ matrix.i }} [skip ci]" || exit 0
          for i in $(seq 1 20); do git pull --rebase --autostash -q && git push -q && break; sleep $((RANDOM % 9 + 3)); done
