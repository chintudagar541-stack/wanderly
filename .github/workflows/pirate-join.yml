# Re-join already rendered chunks of a finished "Pirate render" run (blender/pirate/join.json = {"run_id": ..., "rev": n}).
name: Pirate join
on:
  push:
    branches: [claude/dagar-blender]
    paths: ['blender/pirate/join.json']
permissions:
  contents: write
  actions: read
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: r
        run: echo "run_id=$(jq -r .run_id blender/pirate/join.json)" >> $GITHUB_OUTPUT
      - name: download all chunks (gh paginates; download-artifact@v4 stops at 100)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p dl art
          gh run download ${{ steps.r.outputs.run_id }} -p 'chunk-*' -D dl
          find dl -name '*.mp4' -exec mv -t art {} +
          echo "chunks: $(ls art | wc -l)"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null; pip install pillow -q 2>/dev/null || true
          python3 blender/pirate/compose.py art final.mp4
          mkdir -p previews/pirate
          ffmpeg -loglevel error -y -i final.mp4 -c:v libx264 -preset slow -b:v 9000k -maxrate 11000k -bufsize 20000k -pix_fmt yuv420p -c:a copy -movflags +faststart previews/pirate/final_share.mp4
          ls -la final.mp4 previews/pirate/final_share.mp4
          split -b 90m -d final.mp4 previews/pirate/final_full.mp4.part
          git add previews/pirate/final_full.mp4.part* previews/pirate/final_share.mp4
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git commit -qm "pirate final video [skip ci]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 9 + 3)); done
      - uses: actions/upload-artifact@v4
        with: { name: 'video', path: 'final.mp4', retention-days: 30 }
