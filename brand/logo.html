<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cinzel;font-weight:700;src:url(cinzel-latin-700-normal.woff2)}
@font-face{font-family:Manrope;font-weight:600;src:url(manrope-latin-600-normal.woff2)}
html,body{margin:0;background:#0f0d12}
.card{width:1080px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#1d1a24,#0f0d12 70%)}
.word{font-family:Cinzel;font-weight:700;color:#e9eef3;font-size:62px;letter-spacing:14px;margin-top:40px}
.sub{font-family:Manrope;font-weight:600;color:#d9b45a;font-size:22px;letter-spacing:12px;margin-top:14px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="mark" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <path d="M0,-210 L10,-182 L38,-172 L10,-162 L0,-134 L-10,-162 L-38,-172 L-10,-182Z" fill="#d9b45a" stroke="none"/>
  <path d="M-200,110 L-100,-10 L-50,45 L0,-90 L50,45 L100,-10 L200,110" stroke="#d9b45a" stroke-width="18"/>
  <path d="M-32,-4 L0,-90 L32,-4 L14,-22 L0,-6 L-14,-22Z" fill="#e9eef3" stroke="none"/>
  <path d="M-230,150 L230,150" stroke="#d9b45a" stroke-width="10"/>
</g></defs></svg>
<div class="card" id="icon"><svg width="640" height="640" viewBox="-320 -300 640 640"><use href="#mark"/></svg></div>
<div class="card" id="full"><svg width="460" height="460" viewBox="-260 -240 520 420"><use href="#mark"/></svg>
<div class="word">WARRIORS</div><div class="word" style="margin-top:6px;font-size:40px;letter-spacing:22px">OF THE NORTH</div>
<div class="sub">ANIMATED SERIES</div></div>
</body></html>
