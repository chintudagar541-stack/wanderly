<g font-family="Georgia, serif" fill="#22181a">
  <text x="420" y="470" font-size="30" font-weight="bold">EIRIK "STONEHAND"</text>
  <text x="420" y="498" font-size="16" fill="#7a6a50" letter-spacing="2">FARMHAND BRAWLER · 188 CM</text>
  <text x="420" y="540" font-size="15">• Fights bare-handed with wrapped fists</text>
  <text x="420" y="564" font-size="15">• Twin braids, brow scar, short beard</text>
  <text x="420" y="588" font-size="15">• Wool tunic, leather vest, fur collar</text>
  <text x="420" y="612" font-size="15">• Hand axe is for firewood, never for people</text>
  <text x="1220" y="470" font-size="30" font-weight="bold">SIGRUN FROSTVEIL</text>
  <text x="1220" y="498" font-size="16" fill="#7a6a50" letter-spacing="2">WANDERING SPEAR-MAIDEN · 172 CM</text>
  <text x="1220" y="540" font-size="15">• Calm, precise, keeps her distance</text>
  <text x="1220" y="564" font-size="15">• Silver bob with a blue glass bead</text>
  <text x="1220" y="588" font-size="15">• Teal cloak, bronze brooch, gold-trim tunic</text>
  <text x="1220" y="612" font-size="15">• Ash-wood spear, iron leaf-blade head</text>
</g>

